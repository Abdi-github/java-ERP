# ──────────────────────────────────────────────────────────
# SwiftApp ERP — Application Configuration
# ──────────────────────────────────────────────────────────
spring.application.name=SwiftApp ERP

# ── Database (PostgreSQL 17) ─────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/swiftapp_erp
spring.datasource.username=erp_admin
spring.datasource.password=erp_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Zurich

# ── Flyway (Database Migrations) ────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Thymeleaf ────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ── Spring Security (permit all during dev — tighten later)
# spring.security.user.name=admin
# spring.security.user.password=admin

# ── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# Mail SMTP has no credentials in dev — exclude from health so app stays UP
management.health.mail.enabled=false

# ── Docker Compose ───────────────────────────────────────
spring.docker.compose.lifecycle-management=start-only

# ── Server ───────────────────────────────────────────────
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ── JWT ───────────────────────────────────────────────
app.jwt.secret=SwiftAppErpSecretKeyForJwtTokenGeneration2026CH
app.jwt.expiration-ms=86400000

# ── Logging ──────────────────────────────────────────
logging.level.ch.swiftapp.erp=DEBUG
logging.level.org.springframework.modulith=INFO
logging.level.org.hibernate.SQL=DEBUG

# ── Mail (SMTP) ──────────────────────────────────────
# Dev: Mailpit at localhost:1028 (docker compose)
# Prod: Real SMTP via environment variables
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1028}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:noreply@swiftapp.ch}
app.mail.from-name=SwiftApp ERP

# ── Async / Notification ─────────────────────────────
app.notification.executor.core-size=4
app.notification.executor.max-size=10
app.notification.executor.queue-capacity=500

# ── Spring Modulith Events ───────────────────────────
spring.modulith.events.republish-outstanding-events-on-restart=true

# ── OpenAPI / Swagger UI ─────────────────────────────
# JSON spec path (per group: /api/v1/api-docs/{group-name})
springdoc.api-docs.path=/api/v1/api-docs
# Swagger UI URL
springdoc.swagger-ui.path=/swagger-ui.html
# Only document REST API endpoints, not Thymeleaf view controllers
springdoc.paths-to-match=/api/v1/**
# Sort tags alphabetically, operations by HTTP method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Show full model on the doc page
springdoc.swagger-ui.doc-expansion=list
# Try-it-out enabled by default
springdoc.swagger-ui.try-it-out-enabled=true
# Display request duration
springdoc.swagger-ui.display-request-duration=true
# Disable the generic petstore URL
springdoc.swagger-ui.disable-swagger-default-url=true

