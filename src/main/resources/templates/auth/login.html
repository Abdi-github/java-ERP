<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login – SwiftApp ERP</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">⌚ SwiftApp ERP</h3>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        You have been logged out.
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{auth.username}">Username</label>
                            <input type="text" id="username" name="username"
                                   class="form-control" autocomplete="username" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{auth.password}">Password</label>
                            <input type="password" id="password" name="password"
                                   class="form-control" autocomplete="current-password" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" th:text="#{auth.login}">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
