<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Journal Entries</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{accounting.journalEntries}">Journal Entries</h1>
        <a th:href="@{/app/accounting/journal-entries/new}" class="btn btn-primary">
            ➕ <span th:text="#{common.create}">Create</span>
        </a>
    </div>
    <form class="row g-3 mb-4" th:action="@{/app/accounting/journal-entries}" method="get">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" name="search" class="form-control" th:placeholder="#{common.search}" th:value="${search}"/>
                <button class="btn btn-outline-secondary" type="submit" th:text="#{common.search}">Search</button>
            </div>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0" data-dt data-dt-paging="false">
                <thead><tr>
                    <th>Entry #</th>
                    <th>Date</th>
                    <th>Description</th>
                    <th class="text-end">Debit</th>
                    <th class="text-end">Credit</th>
                    <th>Status</th>
                    <th th:text="#{common.actions}">Actions</th>
                </tr></thead>
                <tbody>
                <tr th:each="entry : ${entries.content}">
                    <td><a th:href="@{/app/accounting/journal-entries/{id}(id=${entry.id()})}" th:text="${entry.entryNumber()}" class="fw-bold text-decoration-none"></a></td>
                    <td th:text="${entry.entryDate()}"></td>
                    <td th:text="${entry.description()}"></td>
                    <td class="text-end" th:text="'CHF ' + ${#numbers.formatDecimal(entry.totalDebit(), 1, 2)}"></td>
                    <td class="text-end" th:text="'CHF ' + ${#numbers.formatDecimal(entry.totalCredit(), 1, 2)}"></td>
                    <td>
                        <span th:if="${entry.posted()}" class="badge bg-success">Posted</span>
                        <span th:unless="${entry.posted()}" class="badge bg-warning">Draft</span>
                        <span th:if="${entry.reversed()}" class="badge bg-danger ms-1">Reversed</span>
                    </td>
                    <td><a th:href="@{/app/accounting/journal-entries/{id}(id=${entry.id()})}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(entries.content)}"><td colspan="7" class="text-center text-muted" th:text="#{common.noResults}">No results</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
