<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Journal Entry Detail</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${entry.entryNumber()}">Journal Entry</h1>
        <div class="d-flex gap-2">
            <form th:if="${!entry.posted()}" th:action="@{/app/accounting/journal-entries/{id}/post(id=${entry.id()})}" method="post">
                <button type="submit" class="btn btn-success">Post</button>
            </form>
            <form th:if="${entry.posted() && !entry.reversed()}" th:action="@{/app/accounting/journal-entries/{id}/reverse(id=${entry.id()})}" method="post">
                <button type="submit" class="btn btn-warning">Reverse</button>
            </form>
            <a th:href="@{/app/accounting/journal-entries}" class="btn btn-outline-secondary" th:text="#{common.back}">Back</a>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Entry Number</dt>
                <dd class="col-sm-9" th:text="${entry.entryNumber()}"></dd>
                <dt class="col-sm-3">Date</dt>
                <dd class="col-sm-9" th:text="${entry.entryDate()}"></dd>
                <dt class="col-sm-3">Description</dt>
                <dd class="col-sm-9" th:text="${entry.description()}"></dd>
                <dt class="col-sm-3">Reference</dt>
                <dd class="col-sm-9" th:text="${entry.reference()} ?: '—'"></dd>
                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9">
                    <span th:if="${entry.posted()}" class="badge bg-success">Posted</span>
                    <span th:unless="${entry.posted()}" class="badge bg-warning">Draft</span>
                    <span th:if="${entry.reversed()}" class="badge bg-danger ms-1">Reversed</span>
                </dd>
            </dl>
        </div>
    </div>
    <div class="card">
        <div class="card-header fw-bold">Lines</div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr>
                    <th>#</th>
                    <th>Account</th>
                    <th>Description</th>
                    <th class="text-end">Debit (CHF)</th>
                    <th class="text-end">Credit (CHF)</th>
                </tr></thead>
                <tbody>
                <tr th:each="line : ${entry.lines()}">
                    <td th:text="${line.position()}"></td>
                    <td th:text="${line.accountNumber() + ' — ' + line.accountName()}"></td>
                    <td th:text="${line.description()} ?: '—'"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(line.debit(), 1, 2)}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(line.credit(), 1, 2)}"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr class="fw-bold">
                    <td colspan="3" class="text-end">Total</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(entry.totalDebit(), 1, 2)}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(entry.totalCredit(), 1, 2)}"></td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
</body>
</html>
