<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${product.name()}">Product Detail</title>
</head>
<body>
<div layout:fragment="content">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/app/masterdata/products}" th:text="#{nav.products}">Products</a></li>
            <li class="breadcrumb-item active" th:text="${product.sku()}">SKU</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${product.name()}">Product Name</h1>
        <div>
            <a th:href="@{/app/masterdata/products/{id}/edit(id=${product.id()})}"
               class="btn btn-primary" th:text="#{common.edit}">Edit</a>
            <form th:action="@{/app/masterdata/products/{id}/delete(id=${product.id()})}"
                  method="post" class="d-inline"
                  onsubmit="return confirm('Are you sure?')">
                <button type="submit" class="btn btn-outline-danger" th:text="#{common.delete}">Delete</button>
            </form>
        </div>
    </div>

    <!-- Product Details Card -->
    <div class="row g-4 mb-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header"><h5 class="mb-0">Product Details</h5></div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4 fw-bold">SKU</div>
                        <div class="col-md-8" th:text="${product.sku()}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4 fw-bold" th:text="#{product.name}">Name</div>
                        <div class="col-md-8" th:text="${product.name()}"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4 fw-bold" th:text="#{product.category}">Category</div>
                        <div class="col-md-8" th:text="${product.categoryName()} ?: '—'"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4 fw-bold">Description</div>
                        <div class="col-md-8" th:text="${product.description()} ?: '—'"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header"><h5 class="mb-0">Pricing</h5></div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-6 fw-bold" th:text="#{product.unitPrice}">Unit Price</div>
                        <div class="col-6 text-end" th:attr="data-chf=${product.unitPrice()}">
                            <span th:text="'CHF ' + ${#numbers.formatDecimal(product.unitPrice(), 1, 2)}"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6 fw-bold" th:text="#{product.listPrice}">List Price</div>
                        <div class="col-6 text-end" th:attr="data-chf=${product.listPrice()}">
                            <span th:text="'CHF ' + ${#numbers.formatDecimal(product.listPrice(), 1, 2)}"></span>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6 fw-bold" th:text="#{product.vat}">VAT</div>
                        <div class="col-6 text-end" th:text="${product.vatRate()}"></div>
                    </div>
                    <div class="row">
                        <div class="col-6 fw-bold">Status</div>
                        <div class="col-6 text-end">
                            <span th:if="${product.active()}" class="badge bg-success">Active</span>
                            <span th:unless="${product.active()}" class="badge bg-secondary">Inactive</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bill of Materials -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Bill of Materials</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Material SKU</th>
                    <th>Material Name</th>
                    <th class="text-end">Quantity</th>
                    <th>UoM</th>
                    <th>Notes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="line : ${bomLines}">
                    <td th:text="${line.position()}"></td>
                    <td th:text="${line.materialSku()}"></td>
                    <td th:text="${line.materialName()}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(line.quantity(), 1, 4)}"></td>
                    <td th:text="${line.unitOfMeasureCode()} ?: '—'"></td>
                    <td th:text="${line.notes()} ?: '—'"></td>
                </tr>
                <tr th:if="${bomLines.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-3">No materials defined yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
