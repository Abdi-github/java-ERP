<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head><title th:text="${editMode} ? 'Fertigungsauftrag bearbeiten' : 'Neuer Fertigungsauftrag'">MO Form</title></head>
<body><div layout:fragment="content">
    <h1 th:text="${editMode} ? 'Fertigungsauftrag bearbeiten' : 'Neuer Fertigungsauftrag'">Production Order Form</h1>
    <form th:action="${editMode} ? @{/app/production/orders/{id}(id=${orderId})} : @{/app/production/orders}" th:object="${orderRequest}" method="post" class="mt-4">
        <div class="row"><div class="col-md-6"><div class="card mb-4"><div class="card-header fw-bold">Order Details</div><div class="card-body">
            <div class="mb-3"><label class="form-label">Product ID</label><input type="text" class="form-control" th:field="*{productId}" required placeholder="Product UUID"/></div>
            <div class="mb-3"><label class="form-label">Work Center</label><select class="form-select" th:field="*{workCenterId}">
                <option value="">— None —</option>
                <option th:each="wc : ${workCenters.content}" th:value="${wc.id()}" th:text="${wc.code() + ' — ' + wc.name()}"></option>
            </select></div>
            <div class="mb-3"><label class="form-label">Planned Quantity</label><input type="number" step="0.01" class="form-control" th:field="*{plannedQuantity}" required/></div>
            <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Start Date</label><input type="date" class="form-control" th:field="*{plannedStartDate}"/></div>
                <div class="col-md-6 mb-3"><label class="form-label">End Date</label><input type="date" class="form-control" th:field="*{plannedEndDate}"/></div></div>
            <div class="mb-3"><label class="form-label">Priority</label><input type="number" class="form-control" th:field="*{priority}" value="0"/></div>
            <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" th:field="*{notes}" rows="2"></textarea></div>
        </div></div></div></div>
        <div class="card mb-4"><div class="card-header fw-bold d-flex justify-content-between align-items-center">
            <span>Material Lines</span><button type="button" class="btn btn-sm btn-outline-primary" onclick="addProdLine()">➕ Add Line</button>
        </div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr>
            <th>Material ID</th><th>Description</th><th class="text-end">Planned Qty</th><th class="text-end">Unit Price</th><th></th>
        </tr></thead><tbody id="linesBody">
        <tr th:each="l, stat : *{lines}">
            <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].materialId}" required/></td>
            <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].description}"/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].plannedQuantity}" required/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].unitPrice}"/></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>
        </tr>
        </tbody></table></div></div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a th:href="@{/app/production/orders}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a></div>
    </form>
    <script th:inline="javascript">
        let idx = [[${orderRequest.lines() != null ? orderRequest.lines().size() : 0}]];
        function addProdLine() {
            const row = document.createElement('tr');
            row.innerHTML = `<td><input type="text" class="form-control form-control-sm" name="lines[${idx}].materialId" required/></td>
                <td><input type="text" class="form-control form-control-sm" name="lines[${idx}].description"/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${idx}].plannedQuantity" required/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${idx}].unitPrice" value="0"/></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>`;
            document.getElementById('linesBody').appendChild(row);
            idx++;
        }
    </script>
</div></body></html>
