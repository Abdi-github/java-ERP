<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head><title th:text="#{production.orders}">Production Orders</title></head>
<body><div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{production.orders}">Production Orders</h1>
        <a th:href="@{/app/production/orders/new}" class="btn btn-primary">➕ <span th:text="#{common.create}">Create</span></a>
    </div>
    <form class="row g-3 mb-4" th:action="@{/app/production/orders}" method="get">
        <div class="col-md-4"><div class="input-group">
            <input type="text" name="search" class="form-control" th:placeholder="#{common.search}" th:value="${search}"/>
            <button class="btn btn-outline-secondary" type="submit" th:text="#{common.search}">Search</button>
        </div></div>
        <div class="col-md-3"><select name="status" class="form-select" onchange="this.form.submit()">
            <option value="">— All statuses —</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == selectedStatus}"></option>
        </select></div>
    </form>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0" data-dt data-dt-paging="false"><thead><tr>
        <th>Order Nr.</th><th>Product</th><th>Work Center</th><th>Status</th><th class="text-end">Planned Qty</th><th>Start Date</th><th th:text="#{common.actions}">Actions</th>
    </tr></thead><tbody>
    <tr th:each="o : ${orders.content}">
        <td><a th:href="@{/app/production/orders/{id}(id=${o.id()})}" th:text="${o.orderNumber()}" class="fw-bold text-decoration-none"></a></td>
        <td th:text="${o.productName()}"></td>
        <td th:text="${o.workCenterName()} ?: '—'"></td>
        <td><span class="badge" th:classappend="${o.status().name() == 'PLANNED' ? 'bg-secondary' : o.status().name() == 'RELEASED' ? 'bg-primary' : o.status().name() == 'IN_PROGRESS' ? 'bg-warning text-dark' : o.status().name() == 'ON_HOLD' ? 'bg-info' : o.status().name() == 'COMPLETED' ? 'bg-success' : 'bg-danger'}" th:text="${o.status()}"></span></td>
        <td class="text-end" th:text="${#numbers.formatDecimal(o.plannedQuantity(), 1, 2)}"></td>
        <td th:text="${o.plannedStartDate()} ?: '—'"></td>
        <td><a th:href="@{/app/production/orders/{id}(id=${o.id()})}" class="btn btn-sm btn-outline-primary">View</a></td>
    </tr>
    <tr th:if="${orders.content.isEmpty()}"><td colspan="7" class="text-center text-muted py-4" th:text="#{common.noResults}">No results</td></tr>
    </tbody></table></div></div>
</div></body></html>
