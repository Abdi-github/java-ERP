<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>Lieferanten</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{purchasing.suppliers}">Suppliers</h1>
        <a th:href="@{/app/purchasing/suppliers/new}" class="btn btn-primary">➕ <span th:text="#{common.create}">Create</span></a>
    </div>
    <form class="row g-3 mb-4" th:action="@{/app/purchasing/suppliers}" method="get">
        <div class="col-md-6"><div class="input-group">
            <input type="text" name="search" class="form-control" th:placeholder="#{common.search}" th:value="${search}"/>
            <button class="btn btn-outline-secondary" type="submit" th:text="#{common.search}">Search</button>
        </div></div>
    </form>
    <div class="card"><div class="table-responsive">
        <table class="table table-hover mb-0" data-dt data-dt-paging="false"><thead><tr>
            <th>Nr.</th><th th:text="#{customer.name}">Name</th><th>E-Mail</th><th>Contact</th>
            <th th:text="#{customer.city}">City</th><th>Status</th><th th:text="#{common.actions}">Actions</th>
        </tr></thead><tbody>
        <tr th:each="s : ${suppliers.content}">
            <td><a th:href="@{/app/purchasing/suppliers/{id}(id=${s.id()})}" th:text="${s.supplierNumber()}" class="fw-bold text-decoration-none"></a></td>
            <td th:text="${s.displayName()}"></td>
            <td th:text="${s.email()} ?: '—'"></td>
            <td th:text="${s.contactPerson()} ?: '—'"></td>
            <td th:text="${s.city()} ?: '—'"></td>
            <td><span th:if="${s.active()}" class="badge bg-success">Active</span><span th:unless="${s.active()}" class="badge bg-secondary">Inactive</span></td>
            <td><a th:href="@{/app/purchasing/suppliers/{id}/edit(id=${s.id()})}" class="btn btn-sm btn-outline-primary" th:text="#{common.edit}">Edit</a></td>
        </tr>
        <tr th:if="${suppliers.content.isEmpty()}"><td colspan="7" class="text-center text-muted py-4" th:text="#{common.noResults}">No results</td></tr>
        </tbody></table>
    </div></div>
</div>
</body></html>
