<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${editMode} ? 'Bestellung bearbeiten' : 'Neue Bestellung'">PO Form</title></head>
<body>
<div layout:fragment="content">
    <h1 th:text="${editMode} ? 'Bestellung bearbeiten' : 'Neue Bestellung'">Purchase Order Form</h1>
    <form th:action="${editMode} ? @{/app/purchasing/orders/{id}(id=${orderId})} : @{/app/purchasing/orders}"
          th:object="${orderRequest}" method="post" class="mt-4">
        <div class="row">
            <div class="col-md-6"><div class="card mb-4"><div class="card-header fw-bold">Order Details</div><div class="card-body">
                <div class="mb-3"><label class="form-label">Supplier</label>
                    <select class="form-select" th:field="*{supplierId}" required>
                        <option value="">— Select supplier —</option>
                        <option th:each="s : ${suppliers.content}" th:value="${s.id()}" th:text="${s.displayName() + ' (' + s.supplierNumber() + ')'}"></option>
                    </select></div>
                <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Order Date</label><input type="date" class="form-control" th:field="*{orderDate}"/></div>
                    <div class="col-md-6 mb-3"><label class="form-label">Expected Delivery</label><input type="date" class="form-control" th:field="*{expectedDeliveryDate}"/></div></div>
                <div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" th:field="*{notes}" rows="3"></textarea></div>
            </div></div></div>
        </div>
        <div class="card mb-4"><div class="card-header fw-bold d-flex justify-content-between align-items-center">
            <span>Order Lines</span><button type="button" class="btn btn-sm btn-outline-primary" onclick="addLine()">➕ Add Line</button>
        </div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr>
            <th>Material ID</th><th>Description</th><th class="text-end">Qty</th><th class="text-end">Unit Price</th><th class="text-end">Discount %</th><th>VAT Rate</th><th></th>
        </tr></thead><tbody id="linesBody">
        <tr th:each="line, stat : *{lines}">
            <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].materialId}" required/></td>
            <td><input type="text" class="form-control form-control-sm" th:field="*{lines[__${stat.index}__].description}"/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].quantity}" required/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].unitPrice}" required/></td>
            <td><input type="number" step="0.01" class="form-control form-control-sm text-end" th:field="*{lines[__${stat.index}__].discountPct}" value="0"/></td>
            <td><select class="form-select form-select-sm" th:field="*{lines[__${stat.index}__].vatRate}"><option th:each="vr : ${vatRates}" th:value="${vr}" th:text="${vr}"></option></select></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>
        </tr>
        </tbody></table></div></div>
        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a th:href="@{/app/purchasing/orders}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a></div>
    </form>
    <script th:inline="javascript">
        let idx = [[${orderRequest.lines() != null ? orderRequest.lines().size() : 0}]];
        const vr = [[${vatRates}]];
        function addLine() {
            const row = document.createElement('tr');
            row.innerHTML = `<td><input type="text" class="form-control form-control-sm" name="lines[${idx}].materialId" required/></td>
                <td><input type="text" class="form-control form-control-sm" name="lines[${idx}].description"/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${idx}].quantity" required/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${idx}].unitPrice" required/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${idx}].discountPct" value="0"/></td>
                <td><select class="form-select form-select-sm" name="lines[${idx}].vatRate">${vr.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">✕</button></td>`;
            document.getElementById('linesBody').appendChild(row);
            idx++;
        }
    </script>
</div>
</body></html>
