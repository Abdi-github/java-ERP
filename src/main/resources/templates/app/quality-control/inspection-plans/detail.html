<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${plan.name()}">Inspection Plan Detail</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${plan.planNumber() + ' — ' + plan.name()}">Inspection Plan</h1>
        <div>
            <a th:href="@{/app/quality-control/inspection-plans/{id}/edit(id=${plan.id()})}"
               class="btn btn-outline-primary" th:text="#{common.edit}">Edit</a>
            <a th:href="@{/app/quality-control/inspection-plans}" class="btn btn-outline-secondary" th:text="#{common.back}">Back</a>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Plan Number</dt>
                        <dd class="col-sm-8" th:text="${plan.planNumber()}"></dd>

                        <dt class="col-sm-4">Name</dt>
                        <dd class="col-sm-8" th:text="${plan.name()}"></dd>

                        <dt class="col-sm-4">Description</dt>
                        <dd class="col-sm-8" th:text="${plan.description()} ?: '—'"></dd>

                        <dt class="col-sm-4">Product ID</dt>
                        <dd class="col-sm-8" th:text="${plan.productId()} ?: '—'"></dd>

                        <dt class="col-sm-4">Material ID</dt>
                        <dd class="col-sm-8" th:text="${plan.materialId()} ?: '—'"></dd>

                        <dt class="col-sm-4">Status</dt>
                        <dd class="col-sm-8">
                            <span th:if="${plan.active()}" class="badge bg-success">Active</span>
                            <span th:unless="${plan.active()}" class="badge bg-secondary">Inactive</span>
                        </dd>

                        <dt class="col-sm-4">Created</dt>
                        <dd class="col-sm-8" th:text="${plan.createdAt()}"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-danger">
        <div class="card-header bg-danger text-white fw-bold">Danger Zone</div>
        <div class="card-body">
            <form th:action="@{/app/quality-control/inspection-plans/{id}/delete(id=${plan.id()})}" method="post"
                  onsubmit="return confirm('Are you sure?');">
                <button type="submit" class="btn btn-outline-danger" th:text="#{common.delete}">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
