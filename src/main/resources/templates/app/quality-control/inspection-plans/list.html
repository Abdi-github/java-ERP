<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="#{qc.inspectionPlans}">Inspection Plans</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{qc.inspectionPlans}">Inspection Plans</h1>
        <a th:href="@{/app/quality-control/inspection-plans/new}" class="btn btn-primary">
            ➕ <span th:text="#{common.create}">Create</span>
        </a>
    </div>

    <form class="row g-3 mb-4" th:action="@{/app/quality-control/inspection-plans}" method="get">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" name="search" class="form-control" th:placeholder="#{common.search}" th:value="${search}"/>
                <button class="btn btn-outline-secondary" type="submit" th:text="#{common.search}">Search</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0" data-dt data-dt-paging="false">
                <thead>
                <tr>
                    <th>Plan #</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th th:text="#{common.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${plans.content}">
                    <td>
                        <a th:href="@{/app/quality-control/inspection-plans/{id}(id=${p.id()})}"
                           th:text="${p.planNumber()}" class="fw-bold text-decoration-none"></a>
                    </td>
                    <td th:text="${p.name()}"></td>
                    <td th:text="${p.description()} ?: '—'"></td>
                    <td>
                        <span th:if="${p.active()}" class="badge bg-success">Active</span>
                        <span th:unless="${p.active()}" class="badge bg-secondary">Inactive</span>
                    </td>
                    <td>
                        <a th:href="@{/app/quality-control/inspection-plans/{id}/edit(id=${p.id()})}"
                           class="btn btn-sm btn-outline-primary" th:text="#{common.edit}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${plans.content.isEmpty()}">
                    <td colspan="5" class="text-center text-muted py-4" th:text="#{common.noResults}">No results</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${plans.totalPages > 1}">
            <span th:text="|Page ${plans.number + 1} of ${plans.totalPages}|"></span>
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${plans.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/quality-control/inspection-plans(page=${plans.number - 1}, search=${search})}">‹</a>
                    </li>
                    <li class="page-item" th:classappend="${plans.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/quality-control/inspection-plans(page=${plans.number + 1}, search=${search})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
