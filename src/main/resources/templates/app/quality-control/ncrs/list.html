<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="#{qc.ncrs}">Non-Conformance Reports</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="#{qc.ncrs}">Non-Conformance Reports</h1>
        <a th:href="@{/app/quality-control/ncrs/new}" class="btn btn-primary">
            ➕ <span th:text="#{common.create}">Create</span>
        </a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0" data-dt data-dt-paging="false">
                <thead>
                <tr>
                    <th>NCR #</th>
                    <th>Quality Check</th>
                    <th>Severity</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th th:text="#{common.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${ncrs.content}">
                    <td>
                        <a th:href="@{/app/quality-control/ncrs/{id}(id=${n.id()})}"
                           th:text="${n.ncrNumber()}" class="fw-bold text-decoration-none"></a>
                    </td>
                    <td>
                        <a th:href="@{/app/quality-control/checks/{id}(id=${n.qualityCheckId()})}"
                           th:text="${n.checkNumber()}" class="text-decoration-none"></a>
                    </td>
                    <td>
                        <span th:if="${n.severity().name() == 'MINOR'}" class="badge bg-info">MINOR</span>
                        <span th:if="${n.severity().name() == 'MAJOR'}" class="badge bg-warning text-dark">MAJOR</span>
                        <span th:if="${n.severity().name() == 'CRITICAL'}" class="badge bg-danger">CRITICAL</span>
                    </td>
                    <td th:text="${#strings.abbreviate(n.description(), 60)}"></td>
                    <td>
                        <span th:if="${n.status().name() == 'OPEN'}" class="badge bg-danger">OPEN</span>
                        <span th:if="${n.status().name() == 'IN_PROGRESS'}" class="badge bg-warning text-dark">IN PROGRESS</span>
                        <span th:if="${n.status().name() == 'CLOSED'}" class="badge bg-success">CLOSED</span>
                    </td>
                    <td>
                        <a th:href="@{/app/quality-control/ncrs/{id}(id=${n.id()})}"
                           class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>
                <tr th:if="${ncrs.content.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4" th:text="#{common.noResults}">No results</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${ncrs.totalPages > 1}">
            <span th:text="|Page ${ncrs.number + 1} of ${ncrs.totalPages}|"></span>
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item" th:classappend="${ncrs.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/quality-control/ncrs(page=${ncrs.number - 1})}">‹</a>
                    </li>
                    <li class="page-item" th:classappend="${ncrs.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/app/quality-control/ncrs(page=${ncrs.number + 1})}">›</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
