<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head><title th:text="${role.name()}">Role Detail</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <i class="bi bi-shield-lock me-2"></i>
            <span th:text="${role.name()}">ADMIN</span>
        </h1>
        <div class="d-flex gap-2">
            <a th:href="@{/app/admin/roles/{id}/edit(id=${role.id()})}"
               class="btn btn-primary"
               sec:authorize="hasAuthority('ADMIN:ROLES_MANAGE')">
                <i class="bi bi-pencil me-1"></i> <span th:text="#{common.edit}">Edit</span>
            </a>
            <form th:action="@{/app/admin/roles/{id}/delete(id=${role.id()})}" method="post"
                  sec:authorize="hasAuthority('ADMIN:ROLES_MANAGE')"
                  th:if="${role.name() != 'ADMIN'}"
                  onsubmit="return confirm('Delete this role?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger">
                    <i class="bi bi-trash me-1"></i> <span th:text="#{common.delete}">Delete</span>
                </button>
            </form>
            <a th:href="@{/app/admin/roles}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> <span th:text="#{common.back}">Back</span>
            </a>
        </div>
    </div>

    <!-- Role Info Card -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h6 class="text-muted" th:text="#{role.name}">Name</h6>
                    <p class="fw-bold" th:text="${role.name()}"></p>
                </div>
                <div class="col-md-6">
                    <h6 class="text-muted" th:text="#{role.description}">Description</h6>
                    <p th:text="${role.description()} ?: '—'"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Permissions Card -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="bi bi-key me-2"></i>
                <span th:text="#{role.permissions}">Permissions</span>
                <span class="badge bg-info ms-2" th:text="${role.permissions().size()}">0</span>
            </h5>
        </div>
        <div class="card-body">
            <div th:if="${role.permissions().isEmpty()}" class="text-muted">
                No permissions assigned to this role.
            </div>

            <div th:each="entry : ${permissionsByModule}" class="mb-3" th:unless="${role.permissions().isEmpty()}">
                <h6 class="text-primary">
                    <i class="bi bi-folder me-1"></i>
                    <span th:text="${entry.key}">MODULE</span>
                </h6>
                <div class="d-flex flex-wrap gap-1">
                    <th:block th:each="perm : ${entry.value}">
                        <span th:if="${role.permissions().contains(perm.code())}"
                              class="badge bg-success" th:text="${perm.code()}"
                              th:title="${perm.description()}">SALES:VIEW</span>
                        <span th:unless="${role.permissions().contains(perm.code())}"
                              class="badge bg-light text-muted border" th:text="${perm.code()}"
                              th:title="${perm.description()}">SALES:VIEW</span>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
