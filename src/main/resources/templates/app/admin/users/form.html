<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title>User Form</title></head>
<body>
<div layout:fragment="content">
    <h1 th:text="${editMode} ? 'Edit User' : 'New User'">User Form</h1>
    <div class="card mt-3">
        <div class="card-body">
            <form th:action="${editMode} ? @{/app/admin/users/{id}(id=${userId})} : @{/app/admin/users}"
                  th:object="${userRequest}" method="post">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{auth.username}">Username</label>
                        <input type="text" class="form-control" th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{auth.password}">Password</label>
                        <input type="password" class="form-control" th:field="*{password}"
                               th:placeholder="${editMode} ? 'Leave blank to keep current' : ''"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" th:field="*{firstName}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" th:field="*{lastName}"/>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{enabled}" id="enabledCheck"/>
                        <label class="form-check-label" for="enabledCheck">Enabled</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" th:text="#{auth.roles}">Roles</label>
                    <div th:each="role : ${allRoles}" class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{roleNames}" th:value="${role.name()}"
                               th:id="${'role_' + role.name()}"/>
                        <label class="form-check-label" th:for="${'role_' + role.name()}" th:text="${role.name() + ' — ' + role.description()}"></label>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
                    <a th:href="@{/app/admin/users}" class="btn btn-secondary" th:text="#{common.cancel}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
