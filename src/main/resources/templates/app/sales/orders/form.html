<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${editMode} ? 'Bestellung bearbeiten' : 'Neue Bestellung'">Sales Order Form</title>
</head>
<body>
<div layout:fragment="content">

    <h1 th:text="${editMode} ? 'Bestellung bearbeiten' : 'Neue Bestellung'">Sales Order Form</h1>

    <form th:action="${editMode} ? @{/app/sales/orders/{id}(id=${orderId})} : @{/app/sales/orders}"
          th:object="${orderRequest}" method="post" class="mt-4">

        <div class="row">
            <!-- Order Info -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header fw-bold">Order Details</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{customer.name}">Customer</label>
                            <select class="form-select" th:field="*{customerId}" required>
                                <option value="" th:text="'— Select customer —'">Choose...</option>
                                <option th:each="c : ${customers.content}"
                                        th:value="${c.id()}"
                                        th:text="${c.displayName() + ' (' + c.customerNumber() + ')'}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('customerId')}"
                                 th:errors="*{customerId}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Order Date</label>
                                <input type="date" class="form-control" th:field="*{orderDate}"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Delivery Date</label>
                                <input type="date" class="form-control" th:field="*{deliveryDate}"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea class="form-control" th:field="*{notes}" rows="3"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Shipping Address -->
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header fw-bold">Shipping Address</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Street</label>
                            <input type="text" class="form-control" th:field="*{shippingStreet}"/>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Postal Code</label>
                                <input type="text" class="form-control" th:field="*{shippingPostalCode}"/>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" th:field="*{shippingCity}"/>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Canton</label>
                                <input type="text" class="form-control" th:field="*{shippingCanton}"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" class="form-control" th:field="*{shippingCountry}" value="CH"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Lines (dynamic) -->
        <div class="card mb-4">
            <div class="card-header fw-bold d-flex justify-content-between align-items-center">
                <span>Order Lines</span>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addOrderLine()">
                    ➕ Add Line
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="orderLinesTable">
                    <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Description</th>
                        <th class="text-end">Qty</th>
                        <th class="text-end">Unit Price</th>
                        <th class="text-end">Discount %</th>
                        <th>VAT Rate</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="orderLinesBody">
                    <tr th:each="line, stat : *{lines}">
                        <td>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{lines[__${stat.index}__].productId}" required/>
                        </td>
                        <td>
                            <input type="text" class="form-control form-control-sm"
                                   th:field="*{lines[__${stat.index}__].description}"/>
                        </td>
                        <td>
                            <input type="number" step="0.01" class="form-control form-control-sm text-end"
                                   th:field="*{lines[__${stat.index}__].quantity}" required/>
                        </td>
                        <td>
                            <input type="number" step="0.01" class="form-control form-control-sm text-end"
                                   th:field="*{lines[__${stat.index}__].unitPrice}" required/>
                        </td>
                        <td>
                            <input type="number" step="0.01" class="form-control form-control-sm text-end"
                                   th:field="*{lines[__${stat.index}__].discountPct}" value="0"/>
                        </td>
                        <td>
                            <select class="form-select form-select-sm"
                                    th:field="*{lines[__${stat.index}__].vatRate}">
                                <option th:each="vr : ${vatRates}" th:value="${vr}" th:text="${vr}"></option>
                            </select>
                        </td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLine(this)">✕</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a th:href="@{/app/sales/orders}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>

    <script th:inline="javascript">
        let lineIndex = [[${orderRequest.lines() != null ? orderRequest.lines().size() : 0}]];
        const vatRates = [[${vatRates}]];

        function addOrderLine() {
            const tbody = document.getElementById('orderLinesBody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="form-control form-control-sm" name="lines[${lineIndex}].productId" required/></td>
                <td><input type="text" class="form-control form-control-sm" name="lines[${lineIndex}].description"/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${lineIndex}].quantity" required/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${lineIndex}].unitPrice" required/></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-end" name="lines[${lineIndex}].discountPct" value="0"/></td>
                <td>
                    <select class="form-select form-select-sm" name="lines[${lineIndex}].vatRate">
                        ${vatRates.map(vr => `<option value="${vr}">${vr}</option>`).join('')}
                    </select>
                </td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeLine(this)">✕</button></td>
            `;
            tbody.appendChild(row);
            lineIndex++;
        }

        function removeLine(btn) {
            btn.closest('tr').remove();
        }
    </script>
</div>
</body>
</html>
