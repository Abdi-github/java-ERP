<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Lagerbewegungen</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <span th:text="#{inventory.movement}">Stock Movements</span>
            <span class="badge bg-secondary ms-2" th:text="${movementTotal}">0</span>
        </h1>
        <a th:href="@{/app/inventory/stock/movements/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Neue Bewegung
        </a>
    </div>

    <div class="alert alert-info" th:if="${movementTotal == 0}">
        Keine Lagerbewegungen vorhanden. Erstellen Sie eine neue Bewegung über "Neue Bewegung".
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Referenz</th>
                <th>Typ</th>
                <th>Artikel-Typ</th>
                <th>Von</th>
                <th>Nach</th>
                <th>Menge</th>
                <th>Datum</th>
                <th>Grund</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${movements.content}">
                <td th:text="${m.referenceNumber()}">GR-20260101-0001</td>
                <td>
                    <span class="badge"
                          th:classappend="${m.movementType().name() == 'GOODS_RECEIPT'    ? 'bg-success' :
                                          (m.movementType().name() == 'GOODS_ISSUE'       ? 'bg-danger' :
                                          (m.movementType().name() == 'PRODUCTION_ISSUE'  ? 'bg-warning text-dark' :
                                          (m.movementType().name() == 'PRODUCTION_RECEIPT'? 'bg-primary' :
                                          (m.movementType().name() == 'SHIPMENT'          ? 'bg-info text-dark' :
                                          (m.movementType().name() == 'TRANSFER'          ? 'bg-secondary' :
                                          (m.movementType().name() == 'ADJUSTMENT'        ? 'bg-warning text-dark' :
                                          (m.movementType().name() == 'RETURN'            ? 'bg-success' :
                                          (m.movementType().name() == 'SCRAP'             ? 'bg-dark' : 'bg-secondary'))))))))}"
                          th:text="${m.movementType()}">GOODS_RECEIPT</span>
                </td>
                <td th:text="${m.itemType()}">PRODUCT</td>
                <td th:text="${m.sourceWarehouseCode()} ?: '—'">—</td>
                <td th:text="${m.targetWarehouseCode()} ?: '—'">—</td>
                <td th:text="${m.quantity()}">10.0000</td>
                <td th:text="${#temporals.format(m.movementDate(), 'dd.MM.yyyy HH:mm')}">01.01.2026</td>
                <td th:text="${m.reason()} ?: '—'">—</td>
            </tr>
            <tr th:if="${movements.content.isEmpty()}">
                <td colspan="8" class="text-center text-muted" th:text="#{common.noResults}">No results</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${movements.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${movements.first} ? 'disabled'">
                <a class="page-link" th:href="@{/app/inventory/stock/movements(page=${movements.number - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, movements.totalPages - 1)}"
                th:classappend="${i == movements.number} ? 'active'">
                <a class="page-link" th:href="@{/app/inventory/stock/movements(page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${movements.last} ? 'disabled'">
                <a class="page-link" th:href="@{/app/inventory/stock/movements(page=${movements.number + 1})}">»</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
