<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Lagerbestand</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Lagerbestand</h1>
            <p class="text-muted mb-0">
                Lager: <strong th:text="${warehouse.code() + ' — ' + warehouse.name()}">WH-01</strong>
            </p>
        </div>
        <a th:href="@{/app/inventory/warehouses}" class="btn btn-outline-secondary" th:text="#{common.back}">Back</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Artikel-ID</th>
                <th>Artikel-Typ</th>
                <th>Bestand</th>
                <th>Reserviert</th>
                <th>Verfügbar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="sl : ${stockLevels.content}">
                <td th:text="${sl.itemId()}">UUID</td>
                <td>
                    <span class="badge" th:classappend="${sl.itemType().name() == 'PRODUCT'} ? 'bg-primary' : 'bg-info'"
                          th:text="${sl.itemType()}">PRODUCT</span>
                </td>
                <td th:text="${sl.quantityOnHand()}">100.0000</td>
                <td th:text="${sl.quantityReserved()}">10.0000</td>
                <td>
                    <strong th:text="${sl.quantityAvailable()}"
                            th:classappend="${sl.quantityAvailable().signum() <= 0} ? 'text-danger' : 'text-success'">90.0000</strong>
                </td>
            </tr>
            <tr th:if="${stockLevels.content.isEmpty()}">
                <td colspan="5" class="text-center text-muted" th:text="#{common.noResults}">No results</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${stockLevels.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${stockLevels.first} ? 'disabled'">
                <a class="page-link" th:href="@{/app/inventory/stock/levels/warehouse/{id}(id=${warehouse.id()}, page=${stockLevels.number - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, stockLevels.totalPages - 1)}"
                th:classappend="${i == stockLevels.number} ? 'active'">
                <a class="page-link" th:href="@{/app/inventory/stock/levels/warehouse/{id}(id=${warehouse.id()}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${stockLevels.last} ? 'disabled'">
                <a class="page-link" th:href="@{/app/inventory/stock/levels/warehouse/{id}(id=${warehouse.id()}, page=${stockLevels.number + 1})}">»</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>
