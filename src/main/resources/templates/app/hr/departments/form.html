<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${editMode} ? 'Abteilung bearbeiten' : 'Neue Abteilung'">Department Form</title></head>
<body>
<div layout:fragment="content">

    <h1>
        <i class="bi bi-diagram-3 me-2"></i>
        <span th:text="${editMode} ? 'Abteilung bearbeiten' : 'Neue Abteilung'">Department Form</span>
    </h1>

    <!-- Error Banner -->
    <div class="alert alert-danger" th:if="${errorMessage}">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="${editMode} ? @{/app/hr/departments/{id}(id=${departmentId})} : @{/app/hr/departments}"
          th:object="${departmentRequest}" method="post" class="mt-4">

        <div class="row">
            <!-- Main Fields -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header fw-bold">
                        <i class="bi bi-pencil-square me-1"></i> Abteilungsdetails
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4 mb-3">
                                <label for="code" class="form-label">Code *</label>
                                <input type="text" id="code" class="form-control font-monospace text-uppercase"
                                       th:field="*{code}" maxlength="20" placeholder="z.B. MFG"
                                       th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{code}"></div>
                                <div class="form-text">Eindeutiger Kurzcode (max. 20 Zeichen)</div>
                            </div>
                            <div class="col-md-8 mb-3">
                                <label for="name" class="form-label">Name *</label>
                                <input type="text" id="name" class="form-control"
                                       th:field="*{name}" maxlength="255" placeholder="z.B. Produktion"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{name}"></div>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="description" class="form-label">Beschreibung</label>
                                <textarea id="description" class="form-control" th:field="*{description}"
                                          rows="3" placeholder="Kurze Beschreibung der Abteilung..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header fw-bold">
                        <i class="bi bi-gear me-1"></i> Einstellungen
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox"
                                   th:field="*{active}" id="deptActive" role="switch"/>
                            <label class="form-check-label" for="deptActive">Abteilung aktiv</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a th:href="@{/app/hr/departments}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>

</div>
</body>
</html>
