<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head><title th:text="${editMode} ? 'Mitarbeiter bearbeiten' : 'Neuer Mitarbeiter'">Employee Form</title></head>
<body>
<div layout:fragment="content">
    <h1 th:text="${editMode} ? 'Mitarbeiter bearbeiten' : 'Neuer Mitarbeiter'">Employee Form</h1>

    <form th:action="${editMode} ? @{/app/hr/employees/{id}(id=${employeeId})} : @{/app/hr/employees}"
          th:object="${employeeRequest}" method="post" class="mt-4">

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header fw-bold">Personal</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Employee Number *</label>
                            <input type="text" class="form-control" th:field="*{employeeNumber}"
                                   th:classappend="${#fields.hasErrors('employeeNumber')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{employeeNumber}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>
                                <input type="text" class="form-control" th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>
                                <input type="text" class="form-control" th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{lastName}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-Mail</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" th:field="*{phone}"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header fw-bold">Employment</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select class="form-select" th:field="*{departmentId}">
                                <option value="">— None —</option>
                                <option th:each="d : ${departments}" th:value="${d.id()}" th:text="${d.name()}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Position</label>
                            <input type="text" class="form-control" th:field="*{position}"/>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Hire Date *</label>
                                <input type="date" class="form-control" th:field="*{hireDate}"
                                       th:classappend="${#fields.hasErrors('hireDate')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{hireDate}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Termination Date</label>
                                <input type="date" class="form-control" th:field="*{terminationDate}"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Salary (CHF)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{salary}"/>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{active}" id="active"/>
                            <label class="form-check-label" for="active">Active</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{common.save}">Save</button>
            <a th:href="@{/app/hr/employees}" class="btn btn-outline-secondary" th:text="#{common.cancel}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
