# ──────────────────────────────────────────────────────────
# SwiftApp ERP — Nginx Site Configuration
# ──────────────────────────────────────────────────────────

upstream app_backend {
    server app:8080;
    keepalive 32;
}

# ════════════════════════════════════════════════════════════
# HTTP Server (port 80)
# ════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name _;

    # ── Health check endpoint (for Docker HEALTHCHECK) ────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Security Headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Uncomment below to redirect HTTP → HTTPS ──────────
    # return 301 https://$host$request_uri;

    # ── Static Assets (long cache) ───────────────────────
    location ~* ^/(css|js|vendor|webjars)/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API Rate Limiting ─────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for API calls
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ── Login Rate Limiting ───────────────────────────────
    location /auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Actuator (restricted) ─────────────────────────────
    location /actuator/ {
        # Only allow internal/health checks
        allow 172.16.0.0/12;   # Docker internal networks
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All Other Requests → Spring Boot ──────────────────
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for HTMX SSE if needed later)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ── Deny hidden files ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

