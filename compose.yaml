# ──────────────────────────────────────────────────────────
# SwiftApp ERP — Development Docker Compose
# ──────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d            # Start ALL services (DB, pgAdmin, Mailpit, App)
#   docker compose up -d --build    # Rebuild app image first, then start all
#   docker compose down             # Stop all services
#   docker compose down -v          # Stop + destroy volumes (reset DB)
#   docker compose logs -f app      # Tail app logs (hot-reload output)
#
# Local-only mode (run app on host instead of Docker):
#   docker compose up -d postgres pgadmin mailpit   # Start infra only
#   ./mvnw spring-boot:run                          # Run app locally
# ──────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 17 ───────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: swiftapp-erp-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftapp_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-swiftapp_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── pgAdmin 4 (Database Admin UI) ──────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: swiftapp-erp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@swiftapp.ch}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
    restart: unless-stopped

  # ── Mailpit (Local Email Testing) ──────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: swiftapp-erp-mailpit
    ports:
      - "1028:1025"     # SMTP: app connects to localhost:1028
      - "8028:8025"     # Web UI: http://localhost:8028
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_UI_AUTH_FILE: ""
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Spring Boot App (Dev with Hot-Reload) ────────────────
  # Hot-reload:
  #   - Thymeleaf templates, CSS, JS, i18n → instant (source mounted)
  #   - Java source changes → devtools auto-restart (~3-5s)
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: swiftapp-erp-app
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src                  # Mount source for hot-reload
      - ./pom.xml:/app/pom.xml:ro       # POM (read-only)
      - maven_cache:/root/.m2           # Cache Maven dependencies across rebuilds
    environment:
      # Override DB to use container hostname (not localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swiftapp_erp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-erp_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      # Mail → Mailpit container (internal port)
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      # Disable Docker Compose auto-management (we ARE inside compose)
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # Thymeleaf cache off for hot-reload
      SPRING_THYMELEAF_CACHE: "false"
      # JWT
      APP_JWT_SECRET: ${JWT_SECRET:-SwiftAppErpSecretKeyForJwtTokenGeneration2026CH}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
  mailpit_data:
    driver: local
  maven_cache:
    driver: local
    

    
   
